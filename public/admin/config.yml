# Decap CMS: the editor at /admin. It saves posts as markdown files in content/ and
# images in public/img/uploads, the same files the site builds from.
# Field names below must match the frontmatter read in lib/markdown.ts.

backend:
  name: github
  repo: avniproject/avni-website-2.0
  # The branch the site is built from. Until the new site is merged into main, that is
  # content-migration (the preview at avni-website-new.netlify.app); switch to main after the merge.
  branch: content-migration

# Local testing: run `npm run cms` next to `npm run dev`, then open
# http://localhost:3000/admin/index.html. Edits go straight to the local files, no login.
local_backend: true

# TODO with the online version: publish_mode: editorial_workflow (Draft -> In review -> Ready),
# which the local test server doesn't support

media_folder: public/img/uploads
public_folder: /img/uploads

# Switch to https://avniproject.org at launch
site_url: https://avni-website-new.netlify.app
logo_url: /logos/avni-logo.png

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: content/blogs
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'blog/{{filename}}'
    sortable_fields: [date, title, category]
    summary: '{{title}} ({{date}})'
    fields:
      - { label: Title, name: title, widget: string }
      - label: Summary
        name: description
        widget: text
        hint: One or two sentences (about 160 characters). Shown on the blog card, in Google results and in WhatsApp/LinkedIn previews.
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD MMM YYYY
        time_format: false
        picker_utc: true
      - { label: Author, name: author, widget: string, default: Avni Team }
      - label: Category
        name: category
        widget: select
        options: [User Story, Technical Story, Knowledge, Avni News, Events]
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: A few keywords, separated by commas, e.g. Health, Field Visit
      - label: Thumbnail
        name: image
        widget: image
        required: false
        hint: Landscape photo, about 1200 x 750 px. Shown on the blog card and in share previews. Keep text and faces away from the edges. Leave empty for the branded card; release posts without a thumbnail get the release-notes card.
      - label: Thumbnail focus
        name: imagePosition
        widget: select
        required: false
        options:
          - { label: Middle, value: center }
          - { label: Top, value: top }
          - { label: Bottom, value: bottom }
        hint: Which part of the thumbnail the card shows when it has to be cropped
      - label: Show thumbnail at the top of the post
        name: showCover
        widget: boolean
        default: false
      - label: Body
        name: body
        widget: markdown
        hint: Images can be any size; the site fits them into a standard frame. For screen recordings, upload an MP4 rather than a GIF.

  - name: case-studies
    label: Case studies
    label_singular: Case study
    folder: content/case-studies
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'resources/case-studies/{{filename}}'
    sortable_fields: [date, title, sector]
    summary: '{{title}} ({{date}})'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text }
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD MMM YYYY
        time_format: false
        picker_utc: true
      - { label: Author, name: author, widget: string, default: Avni Team }
      - label: Sector
        name: sector
        widget: select
        options: [Education, Healthcare, Water & Sanitation, Waste Management, Social Security, Livelihood, Legal Aid, Sports]
      - { label: Partner logo, name: logo, widget: image, required: false }
      - { label: Thumbnail, name: image, widget: image, required: false }
      - label: Show thumbnail at the top of the page
        name: showCover
        widget: boolean
        default: false
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }

# Pages CMS (https://pagescms.org): the website editor for blogs and case studies.
# Field names must match the frontmatter read in lib/markdown.ts.

# The image library shows every post's images (one folder per post), so a thumbnail can be
# picked from images already in the post instead of uploading it again
media:
  input: public/img
  output: /img

content:
  - name: blog
    label: Blog posts
    type: collection
    path: content/blogs
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        description: One or two sentences, shown on the blog card and in Google results
      - name: date
        label: Date
        type: date
      - name: author
        label: Authors
        type: reference
        description: Pick one or more people from the author directory. Not listed? Add them under Authors first.
        options:
          collection: authors
          multiple: true
          search: name
          value: '{fields.name}'
          label: '{fields.name}'
      - name: category
        label: Category
        type: select
        options:
          values: [User Story, Technical Story, Knowledge, Avni News, Events]
      - name: sectors
        label: Sectors
        type: select
        description: The sectors this post is about. Leave empty for events and announcements.
        options:
          multiple: true
          values: [Education, Healthcare, Water & Sanitation, Agriculture, Waste Management, Social Security, Livelihood, Child Protection, Legal Aid, Human Rights, Sports]
      - name: image
        label: Thumbnail
        type: image
        description: Pick a photo already in the post (open its folder in the library) or upload one. Landscape, about 1200 x 750 px.
      - name: body
        label: Body
        type: rich-text

  - name: case-studies
    label: Case studies
    type: collection
    path: content/case-studies
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date, sector]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
      - name: date
        label: Date
        type: date
      - name: author
        label: Authors
        type: reference
        description: Pick one or more people from the author directory. Not listed? Add them under Authors first.
        options:
          collection: authors
          multiple: true
          search: name
          value: '{fields.name}'
          label: '{fields.name}'
      - name: sector
        label: Sector
        type: select
        options:
          values: [Education, Healthcare, Water & Sanitation, Agriculture, Waste Management, Social Security, Livelihood, Child Protection, Legal Aid, Human Rights, Sports]
      - name: logo
        label: Partner logo
        type: image
      - name: image
        label: Thumbnail
        type: image
        description: Pick a photo already in the case study (open its folder in the library) or upload one. Shown on the card and the homepage.
      - name: body
        label: Body
        type: rich-text

  - name: authors
    label: Authors
    type: collection
    path: content/authors
    filename: '{primary}.md'
    view:
      fields: [name, organisation]
      primary: name
      sort: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: organisation
        label: Organisation
        type: string
      - name: linkedin
        label: LinkedIn profile
        type: string
        description: Full link, e.g. https://www.linkedin.com/in/firstname-lastname/
      - name: photo
        label: Photo
        type: image
        description: Square photo, at least 400 x 400 px
      - name: body
        label: Short bio
        type: text
        description: One or two sentences

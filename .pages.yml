# Pages CMS (https://pagescms.org) trial: the same blog and case study fields as the
# Decap editor in public/admin/config.yml. Field names must match lib/markdown.ts.

media:
  input: public/img/uploads
  output: /img/uploads

content:
  - name: blog
    label: Blog posts
    type: collection
    path: content/blogs
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        description: One or two sentences, shown on the blog card and in Google results
      - name: date
        label: Date
        type: date
      - name: author
        label: Author
        type: string
        default: Avni Team
      - name: category
        label: Category
        type: select
        options:
          values: [User Story, Technical Story, Knowledge, Avni News, Events]
      - name: sectors
        label: Sectors
        type: select
        description: The sectors this post is about. Leave empty for events and announcements.
        options:
          multiple: true
          values: [Education, Healthcare, Water & Sanitation, Agriculture, Waste Management, Social Security, Livelihood, Child Protection, Legal Aid, Human Rights, Sports]
      - name: image
        label: Thumbnail
        type: image
        description: Landscape photo, about 1200 x 750 px, shown on the blog card
      - name: body
        label: Body
        type: rich-text

  - name: case-studies
    label: Case studies
    type: collection
    path: content/case-studies
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date, sector]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
      - name: date
        label: Date
        type: date
      - name: author
        label: Author
        type: string
        default: Avni Team
      - name: sector
        label: Sector
        type: select
        options:
          values: [Education, Healthcare, Water & Sanitation, Agriculture, Waste Management, Social Security, Livelihood, Child Protection, Legal Aid, Human Rights, Sports]
      - name: logo
        label: Partner logo
        type: image
      - name: image
        label: Thumbnail
        type: image
        description: Landscape photo, shown on the case study card and the homepage
      - name: body
        label: Body
        type: rich-text
